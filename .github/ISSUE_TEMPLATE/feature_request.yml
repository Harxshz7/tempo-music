name: 💡 Feature Request
description: Propose a new feature, UX improvement, or enhancement for Tempo
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions that help make Tempo a better Subsonic player!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: "I'm always frustrated when I want to reorder tracks in the playing queue..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe the solution you'd like to see implemented.
      placeholder: "Add drag handles next to tracks in the Player modal queue..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR to implement this feature.
          required: false
